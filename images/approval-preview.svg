<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" font-family="Arial, Helvetica, sans-serif">
  <rect width="640" height="480" fill="#0c0c0c"/>
  <!-- card -->
  <rect x="140" y="26" width="360" height="426" rx="16" fill="#141414" stroke="#262626"/>
  <!-- logo -->
  <rect x="168" y="52" width="46" height="46" rx="6" fill="#ffffff"/>
  <text x="191" y="81" text-anchor="middle" font-size="13" font-weight="700" fill="#1f5c2e">RI</text>
  <!-- company -->
  <text x="168" y="134" font-size="30" font-weight="800" fill="#ffffff" letter-spacing="0.5">REFORMITY INC.</text>
  <text x="168" y="156" font-size="13" fill="#8a8a8a">Quote Q-016565  ·  for Bruce Wayne</text>
  <line x1="168" y1="172" x2="472" y2="172" stroke="#1f1f1f" stroke-width="1"/>
  <!-- project address -->
  <text x="168" y="197" font-size="13" fill="#9a9a9a">Project address</text>
  <text x="472" y="197" text-anchor="end" font-size="13" fill="#e6e6e6">123 Main St, Toronto ON</text>
  <line x1="168" y1="214" x2="472" y2="214" stroke="#1f1f1f" stroke-width="1"/>
  <!-- total -->
  <text x="168" y="241" font-size="13" fill="#9a9a9a">Total</text>
  <text x="472" y="245" text-anchor="end" font-size="26" font-weight="800" fill="#3a9e52">CAD 4,407.00</text>
  <!-- note box -->
  <rect x="168" y="264" width="304" height="46" rx="8" fill="#0d0d0d" stroke="#2a2a2a"/>
  <text x="182" y="285" font-size="12" fill="#666666">Add a note for your contractor (optional)</text>
  <!-- buttons -->
  <rect x="168" y="324" width="146" height="46" rx="9" fill="#3a9e52"/>
  <text x="241" y="353" text-anchor="middle" font-size="15" font-weight="700" fill="#06210f">Approve quote</text>
  <rect x="326" y="324" width="146" height="46" rx="9" fill="none" stroke="#5a2a2a" stroke-width="1.5"/>
  <text x="399" y="353" text-anchor="middle" font-size="15" font-weight="700" fill="#e08a8a">Decline</text>
  <!-- disclaimer -->
  <text x="168" y="398" font-size="9.5" fill="#5a5a5a">AI-generated design renders shown for illustration only.</text>
  <!-- footer -->
  <text x="320" y="474" text-anchor="middle" font-size="11" fill="#444444">Powered by Finalook</text>
</svg>
