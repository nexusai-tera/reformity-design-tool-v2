<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>See Your New Yard · Finalook</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#0a0a0a;color:#ececec;font-family:'Inter',sans-serif;line-height:1.6;min-height:100vh;}
  .wrap{max-width:560px;margin:0 auto;padding:28px 20px 60px;}
  .brand{display:flex;align-items:center;gap:12px;margin-bottom:6px;}
  .brand img{height:46px;max-width:160px;object-fit:contain;}
  .brand .co{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:1px;color:#fff;}
  .lead{color:#9a9a9a;font-size:14px;margin-bottom:22px;}
  h1{font-family:'Bebas Neue',sans-serif;font-size:clamp(34px,8vw,48px);line-height:1;margin:10px 0 6px;}
  h1 .g{color:#3a9e52;}
  .sub{color:#bdbdbd;font-size:15px;margin-bottom:24px;}
  .label{font-size:12px;color:#888;text-transform:uppercase;letter-spacing:.08em;font-weight:600;margin:18px 0 8px;}
  .trades{display:flex;flex-wrap:wrap;gap:8px;}
  .trade{border:1px solid #2a2a2a;background:#151515;color:#cfcfcf;border-radius:99px;padding:9px 16px;font-size:13px;cursor:pointer;font-family:'Inter',sans-serif;}
  .trade.on{border-color:#3a9e52;background:#13231a;color:#fff;}
  .drop{border:1.5px dashed #2f2f2f;border-radius:12px;padding:26px;text-align:center;color:#888;cursor:pointer;background:#101010;}
  .drop img{max-width:100%;border-radius:8px;display:block;margin:0 auto;}
  input[type=text],input[type=email],input[type=tel]{width:100%;background:#0d0d0d;border:1px solid #2a2a2a;color:#eee;border-radius:8px;padding:12px;font-size:14px;font-family:'Inter',sans-serif;margin-bottom:10px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  @media(max-width:460px){.row2{grid-template-columns:1fr;}}
  .cta{width:100%;background:#3a9e52;color:#06210f;border:none;border-radius:10px;padding:15px;font-weight:700;font-size:16px;cursor:pointer;font-family:'Inter',sans-serif;margin-top:14px;}
  .cta:disabled{opacity:.5;cursor:default;}
  .fine{color:#666;font-size:11px;margin-top:10px;line-height:1.5;}
  .msg{font-size:14px;margin-top:12px;}
  .err{color:#e08a8a;}
  .ok{color:#3a9e52;}
  .ba{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0;}
  .ba figure{margin:0;}
  .ba img{width:100%;border-radius:10px;border:1px solid #242424;}
  .ba figcaption{font-size:11px;color:#888;text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px;}
  .state{text-align:center;padding:50px 14px;color:#9a9a9a;}
  .state .big{font-family:'Bebas Neue',sans-serif;font-size:40px;color:#fff;letter-spacing:1px;}
  .spin{display:inline-block;width:18px;height:18px;border:2px solid #333;border-top-color:#3a9e52;border-radius:50%;animation:s .8s linear infinite;vertical-align:middle;}
  @keyframes s{to{transform:rotate(360deg);}}
  .foot{text-align:center;color:#555;font-size:11px;margin-top:30px;}
  .foot a{color:#3a9e52;text-decoration:none;}
</style>
</head>
<body>
<div class="wrap" id="root">
  <div class="state"><span class="spin"></span> <span>Loading…</span></div>
</div>

<script>
const slug=new URLSearchParams(location.search).get('s')||new URLSearchParams(location.search).get('slug');
const source=(new URLSearchParams(location.search).get('src')||new URLSearchParams(location.search).get('source')||'virtual_quote');
const TURNSTILE_SITEKEY=''; // ← paste your Cloudflare Turnstile site key here to turn on bot protection
const root=document.getElementById('root');
let info=null, trade='fence', photoB64='';
const TRADES=[['fence','Fence'],['deck','Deck'],['interlock','Interlock'],['concrete','Concrete'],['landscaping','Landscaping'],['masonry','Masonry']];
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

async function load(){
  if(!slug){ root.innerHTML='<div class="state"><div class="big">Invalid link</div><p>This preview link is missing its code.</p></div>'; return; }
  try{
    const r=await fetch('/api/q-info?slug='+encodeURIComponent(slug));
    const d=await r.json();
    if(!r.ok) throw new Error(d.error||'Not found');
    info=d;
    if(!info.available){ renderUnavailable(); return; }
    renderForm();
  }catch(e){
    root.innerHTML='<div class="state"><div class="big">Page not found</div><p>'+esc(e.message)+'</p></div>';
  }
}

function brandHeader(){
  const logo=info.logo?`<img src="${esc(info.logo)}" alt="logo"/>`:'';
  return `<div class="brand">${logo}<div class="co">${esc(info.company)}</div></div>`;
}
function renderUnavailable(){
  root.innerHTML=brandHeader()+`<div class="state"><div class="big">Coming soon</div><p>${esc(info.company)}'s instant preview isn't available right now. Reach out to them directly and they'll be happy to help.</p></div>`;
}
function renderForm(){
  root.innerHTML=brandHeader()
    +`<p class="lead">Free instant preview by ${esc(info.company)}</p>`
    +`<h1>See your <span class="g">finished yard</span> before you commit.</h1>`
    +`<p class="sub">Upload a photo of your space, pick what you're thinking about, and get an instant AI preview of the finished result. No obligation.</p>`
    +`<div class="label">1 · What are you considering?</div><div class="trades" id="trades">`
    + TRADES.map(t=>`<button type="button" class="trade${t[0]===trade?' on':''}" data-t="${t[0]}" onclick="pickTrade('${t[0]}')">${t[1]}</button>`).join('')
    +`</div>`
    +`<div class="label">2 · A photo of your space</div>`
    +`<label class="drop" id="drop"><span id="dropTxt">Tap to add a photo of your yard, driveway, or wall</span><input type="file" id="file" accept="image/*" style="display:none" onchange="onFile(event)"/></label>`
    +`<div class="label">3 · Where should we send it?</div>`
    +`<input type="text" id="nm" placeholder="Your name"/>`
    +`<div class="row2"><input type="email" id="em" placeholder="Email (required)"/><input type="tel" id="ph" placeholder="Phone (optional)"/></div>`
    +(TURNSTILE_SITEKEY?`<div class="cf-turnstile" data-sitekey="${TURNSTILE_SITEKEY}" style="margin-top:14px;"></div>`:``)
    +`<button class="cta" id="go" onclick="generate()">Generate my free preview</button>`
    +`<div class="msg" id="msg"></div>`
    +`<p class="fine">By submitting, your photo and details are shared with ${esc(info.company)} so they can follow up about your project.</p>`
    +`<div class="foot">Powered by <a href="https://finalook.ai" target="_blank">Finalook</a></div>`;
}
function pickTrade(t){ trade=t; document.querySelectorAll('.trade').forEach(b=>b.classList.toggle('on',b.dataset.t===t)); }

function onFile(e){
  const f=e.target.files[0]; if(!f) return;
  const img=new Image();
  const fr=new FileReader();
  fr.onload=ev=>{ img.onload=()=>{
    const max=1600, sc=Math.min(1,max/Math.max(img.width,img.height));
    const c=document.createElement('canvas'); c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    const url=c.toDataURL('image/jpeg',0.85); photoB64=url.split(',')[1];
    document.getElementById('drop').innerHTML='<img src="'+url+'" alt="your photo"/>';
    const fi=document.createElement('input'); // re-attach hidden input not needed; label still wraps
  }; img.src=ev.target.result; };
  fr.readAsDataURL(f);
}

async function generate(){
  const msg=document.getElementById('msg'); msg.className='msg';
  const email=(document.getElementById('em').value||'').trim();
  if(!photoB64){ msg.className='msg err'; msg.textContent='Please add a photo first.'; return; }
  if(!/^[^@]+@[^@]+\.[^@]+$/.test(email)){ msg.className='msg err'; msg.textContent='Please enter a valid email so we can send your preview.'; return; }
  const go=document.getElementById('go'); go.disabled=true;
  msg.className='msg'; msg.innerHTML='<span class="spin"></span> Generating your preview… 20–40 seconds';
  try{
    const r=await fetch('/api/q-generate',{
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({slug, trade, source, turnstileToken:((TURNSTILE_SITEKEY&&window.turnstile)?(window.turnstile.getResponse()||''):''), name:document.getElementById('nm').value.trim(), email, phone:document.getElementById('ph').value.trim(), imageB64:photoB64})
    });
    const d=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(d.error||'Could not generate the preview.');
    showResult(d.render);
  }catch(e){ msg.className='msg err'; msg.textContent=e.message; go.disabled=false; }
}

function showResult(renderB64){
  root.innerHTML=brandHeader()
    +`<h1>Here's your <span class="g">preview.</span></h1>`
    +`<p class="sub">This is an AI preview to help you picture it — actual materials and finish may vary.</p>`
    +`<div class="ba"><figure><figcaption>Your photo</figcaption><img id="baBefore"/></figure><figure><figcaption>Possible result</figcaption><img src="data:image/png;base64,${renderB64}"/></figure></div>`
    +`<div class="state ok" style="padding:18px 0;"><div class="big" style="font-size:30px;color:#3a9e52;">You're all set ✓</div><p>${esc(info.company)} has your details and will reach out about your project.</p></div>`
    +`<div class="foot">Powered by <a href="https://finalook.ai" target="_blank">Finalook</a></div>`;
  // restore the before photo from memory
  const b=document.getElementById('baBefore'); if(b) b.src='data:image/jpeg;base64,'+photoB64;
}

load();
</script>
</body>
</html>
